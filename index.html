<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body id="body" class="">
  <div class="btn">
    <button class="btnPlay" id="btnPlay">PLAY</button>
    <button class="btnStop" id="btnStop"><i class="fa-solid fa-stop"></i></button>
    <button class="btnIa" id="btnIa">IA</button>
  </div>

  <div id="game">
    <div id="ball" class=""></div>
    <div id="paddle-left" class="paddle"></div>
    <div id="paddle-right" class="paddle"></div>
    <div id="score">
      <span id="score-left">0</span> - <span id="score-right">0</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
